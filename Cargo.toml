[package]
name = "xdm-rust"
version = "1.0.0"
edition = "2021"
authors = ["Google Antigravity and Vinaya Gaurang <vinayagaurang@zohomail.in>"]
description = "High-Performance Multi-threaded Download Manager for Windows 11"

[dependencies]
# GUI Framework
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29.1"

# Async & Networking
tokio = { version = "1.41", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "json"] }
futures-util = "0.3"

# Windows Native System Tray & Win32 Integration
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52.0", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
] }

# Utilities & Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }
url = "2.5"
rfd = "0.15" # Native Windows File Dialog (Save As, Open Folder)
open = "5.3"  # Open downloaded file or folder in Windows Explorer
arboard = "3.4" # Clipboard access

[profile.release]
opt-level = 3
codegen-units = 16
strip = true
